# The nested test instance from a hyprlang config (HYPRNS_TEST_CONFIG=test/nested-hyprlang.conf
# test/nested.sh start): checks that hyprns reads its keys from hyprlang as well as Lua.
# Load the plugin with `nested.sh ctl plugin load`, then `nested.sh ctl hyprns status`.

monitor = , preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0xff404040
}

animations {
    enabled = false
}

plugin {
    hyprns {
        look = marble
        budget_ms = 3
    }
}
